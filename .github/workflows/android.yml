# Compila l'app per tablet Android (.apk) dalle stesse sorgenti dell'app
# Windows, per tutte e tre le versioni: MED System Gineco, Proct e base.
# Parte a mano (Actions → «App Android (tablet)» → Run workflow) e, solo come
# prova di compilazione, sulle pull request che toccano l'app.
#  - senza «pubblica»: gli .apk restano come artefatti scaricabili (prova)
#  - con «pubblica» (dal ramo main): gli .apk si aggiungono alla release
#    desktop-v<versione di tauri.conf.json>, accanto agli installer Windows,
#    così il portale e le email possono dare il link anche per il tablet.
# Firma: Android installa un aggiornamento solo se è firmato con la stessa
# chiave della versione già presente. La chiave sta nei secret
# ANDROID_KEYSTORE (file .jks in base64) e ANDROID_KEYSTORE_PASSWORD. Se
# mancano si usa una chiave usa-e-getta: l'.apk si installa, ma per
# aggiornarlo bisognerà disinstallarlo (perdendo i dati del tablet).
name: App Android (tablet)

on:
  pull_request:
    paths:
      - 'desktop/src-tauri/**'
      - 'desktop/bridge/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      pubblica:
        description: 'Aggiungi gli .apk alla release desktop-v<versione> (solo da main)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        modello: [gineco, proct, base]
    defaults:
      run:
        working-directory: desktop
    env:
      NDK_VERSIONE: 27.2.12479018
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # L'SDK Android è già installato sui runner di GitHub (ANDROID_HOME)
      - name: NDK
        run: |
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "ndk;$NDK_VERSIONE" "build-tools;34.0.0" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSIONE" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'desktop/src-tauri -> target'
          key: android-${{ matrix.modello }}

      - name: Dipendenze
        run: npm ci

      - name: Prepara l'app (index.html + librerie locali + bridge database)
        run: node scripts/prepara-app.mjs ${{ matrix.modello }}

      - name: Progetto Android e compilazione
        shell: bash
        run: |
          conf=()
          if [ "${{ matrix.modello }}" != "gineco" ]; then conf+=(--config src-tauri/tauri.${{ matrix.modello }}.conf.json); fi
          npx tauri android init --ci --skip-targets-install "${conf[@]}"
          # Android 10: senza questa voce l'app non può scrivere in Download/Documents
          sed -i 's/<application /<application android:requestLegacyExternalStorage="true" /' src-tauri/gen/android/app/src/main/AndroidManifest.xml
          npx tauri android build --ci --apk --target aarch64 armv7 "${conf[@]}" --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Firma dell'.apk
        shell: bash
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' | head -1)
          test -n "$apk" || { echo "::error::.apk non trovato"; exit 1; }
          if [ -n "$ANDROID_KEYSTORE" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            printf %s "$ANDROID_KEYSTORE" | tr -d '\r\n\t ' | base64 -d > "$RUNNER_TEMP/medsystem.jks"
            pass="$ANDROID_KEYSTORE_PASSWORD"
          else
            echo "::warning::Secret ANDROID_KEYSTORE mancante: .apk firmato con una chiave usa-e-getta (solo prova)"
            pass=provvisoria
            keytool -genkeypair -keystore "$RUNNER_TEMP/medsystem.jks" -alias medsystem -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$pass" -keypass "$pass" -dname "CN=MED System prova" > /dev/null
          fi
          bt="$ANDROID_HOME/build-tools/34.0.0"
          "$bt/zipalign" -f -p 4 "$apk" "$RUNNER_TEMP/allineato.apk"
          versione=$(node -p "require('./src-tauri/tauri.conf.json').version")
          nome=$(node -p "require('./src-tauri/tauri.' + ('${{ matrix.modello }}'==='gineco' ? '' : '${{ matrix.modello }}.') + 'conf.json').productName" | tr ' ' '.')
          mkdir -p apk
          "$bt/apksigner" sign --ks "$RUNNER_TEMP/medsystem.jks" --ks-pass "pass:$pass" \
            --out "apk/${nome}_${versione}_android.apk" "$RUNNER_TEMP/allineato.apk"
          "$bt/apksigner" verify "apk/${nome}_${versione}_android.apk"
          ls -l apk

      - name: .apk come artefatto
        uses: actions/upload-artifact@v4
        with:
          name: MEDSystem-${{ matrix.modello }}-android
          path: desktop/apk/*.apk
          if-no-files-found: error

  release:
    if: inputs.pubblica && github.ref == 'refs/heads/main'
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nome del tag
        id: tag
        run: echo "nome=desktop-v$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: apk
          pattern: MEDSystem-*-android
          merge-multiple: true

      - name: Aggiungi gli .apk alla release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.tag.outputs.nome }}" apk/*.apk --clobber --repo "${{ github.repository }}"
